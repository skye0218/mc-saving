<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mc. Saving · 麦当劳省钱精算</title>
  <link rel="stylesheet" href="app.css?v=20261023" />
</head>
<body>
  <div class="app">
    <header class="hd">
      <div class="logo">🍔 Mc. Saving</div>
      <div class="sub">接麦当劳官方 MCP · 算出点到最低价的组合</div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="wish">点名最省</button>
    </nav>

    <!-- 点名模式 -->
    <section class="panel" id="panel-wish">
      <div class="hint">勾选你想吃的，一键算「用哪几张券最便宜」。</div>
      <div class="quick">
        <button class="mini" id="btn-all">全选</button>
        <button class="mini" id="btn-clear">清空</button>
      </div>
      <div class="cats" id="cat-tabs"></div>
      <div class="grid" id="menu-grid"></div>
      <button class="cta" id="btn-wish">算最省组合</button>
    </section>

    <!-- 可用优惠券 -->
    <section class="panel">
      <div class="sec-title">🎟️ 可用优惠券（内置真实样例）</div>
      <div class="coupons" id="coupon-list"></div>
    </section>

    <!-- 结果 -->
    <section class="panel hidden" id="result-panel">
      <div class="sec-title">✅ 最优方案</div>
      <div id="result"></div>
    </section>

    <!-- 下单 -->
    <section class="panel hidden" id="order-panel">
      <div class="sec-title">🛒 带着最优方案去下单</div>
      <div id="order-summary"></div>
      <button class="cta" id="btn-order">去麦当劳官方小程序下单确认</button>
      <div class="order-tip">跳转后在官方小程序按此清单点单，并使用上方算好的券。</div>
    </section>

    <footer class="ft">
      取数交给 MCP，算术交给代码。本页为参赛演示，菜单/券为脱敏样例数据。
    </footer>
  </div>

  <!-- 下单跳转弹层 -->
  <div class="modal-mask hidden" id="order-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">×</button>
      <div class="modal-title">📲 跳转麦当劳官方小程序</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="m-btn ghost" id="modal-copy">复制下单清单</button>
        <button class="m-btn primary" id="modal-open">打开小程序</button>
      </div>
    </div>
  </div>

  <script src="optimizer.js?v=20261023"></script>
  <script src="sample_data.js?v=20261023"></script>
  <script src="app.js?v=20261023"></script>
</body>
</html>
